<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notificaciones con reverse() y finished</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }

    button {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .zona-notificaciones {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 280px;
    }

    .toast {
      background: #1e293b;
      color: white;
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .toast small {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <button id="btn-lanzar">+ Nueva notificación</button>
  <div id="contenedor" class="zona-notificaciones"></div>

  <script>
    const contenedor = document.getElementById("contenedor");
    let contador = 1;

    document.getElementById("btn-lanzar").addEventListener("click", () => {
      // 1. Creamos el elemento HTML
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span>Aviso #${contador++}</span><small>Cerrar</small>`;
      contenedor.appendChild(toast);

      // 2. Animamos su entrada
      const animacion = toast.animate(
        [
          { opacity: 0, transform: "translateX(120%)" },
          { opacity: 1, transform: "translateX(0)" }
        ],
        {
          duration: 400,
          easing: "ease-out",
          fill: "forwards"
        }
      );

      // 3. Al hacer clic, invertimos la animación y esperamos a que termine para borrarlo
      toast.addEventListener("click", async () => {
        animacion.reverse();
        await animacion.finished;
        toast.remove();
      });
    });
  </script>

</body>
</html>
