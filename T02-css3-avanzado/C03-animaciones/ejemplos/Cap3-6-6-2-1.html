<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de View Timeline con Nombre</title>
  <style>
    /* 1. Elevamos el ámbito de las tres líneas de tiempo a todo el body */
    body {
      timeline-scope: --sec1, --sec2, --sec3;
      font-family: system-ui, sans-serif;
      margin: 0;
    }

    /* 2. Menú fijo en la parte superior */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #1e293b;
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 10;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      animation: resaltar linear both;
    }

    /* 3. Conectamos cada enlace con la línea de tiempo de su sección */
    .link-1 { animation-timeline: --sec1; }
    .link-2 { animation-timeline: --sec2; }
    .link-3 { animation-timeline: --sec3; }

    /* 4. Cada sección crea su propia línea de tiempo de vista en el eje vertical (block) */
    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }

    #seccion1 {
      background: #f1f5f9;
      view-timeline: --sec1 block;
    }

    #seccion2 {
      background: #e2e8f0;
      view-timeline: --sec2 block;
    }

    #seccion3 {
      background: #cbd5e1;
      view-timeline: --sec3 block;
    }

    /* 5. La animación se activa cuando la sección está en el centro de la pantalla */
    @keyframes resaltar {
      0%, 100% {
        color: #94a3b8;
        background-color: transparent;
      }
      40%, 60% {
        color: #ffffff;
        background-color: #4f46e5;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#seccion1" class="link-1">Sección 1</a>
    <a href="#seccion2" class="link-2">Sección 2</a>
    <a href="#seccion3" class="link-3">Sección 3</a>
  </nav>

  <main>
    <section id="seccion1">Contenido de la Sección 1</section>
    <section id="seccion2">Contenido de la Sección 2</section>
    <section id="seccion3">Contenido de la Sección 3</section>
  </main>

</body>
</html>
