<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Recorrido de los 7 capítulos del Tema 2: CSS3 Avanzado">
  <rect width="1200" height="260" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">Tema 2 · CSS3 Avanzado — recorrido por capítulos</text>

  <!-- línea -->
  <line x1="110" y1="125" x2="1090" y2="125" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <circle cx="110" cy="125" r="34" fill="#6366f1"/>
    <text x="110" y="134" font-size="26" font-weight="800" fill="#fff">1</text>
    <text x="110" y="190" font-size="17" font-weight="700" fill="#1e293b">Efectos</text>
    <text x="110" y="212" font-size="17" font-weight="700" fill="#1e293b">visuales</text>
    <!-- 2 -->
    <circle cx="273" cy="125" r="34" fill="#7c3aed"/>
    <text x="273" y="134" font-size="26" font-weight="800" fill="#fff">2</text>
    <text x="273" y="190" font-size="17" font-weight="700" fill="#1e293b">Selectores</text>
    <!-- 3 -->
    <circle cx="436" cy="125" r="34" fill="#a21caf"/>
    <text x="436" y="134" font-size="26" font-weight="800" fill="#fff">3</text>
    <text x="436" y="190" font-size="17" font-weight="700" fill="#1e293b">Animaciones</text>
    <!-- 4 -->
    <circle cx="600" cy="125" r="34" fill="#db2777"/>
    <text x="600" y="134" font-size="26" font-weight="800" fill="#fff">4</text>
    <text x="600" y="190" font-size="17" font-weight="700" fill="#1e293b">Flexbox</text>
    <!-- 5 -->
    <circle cx="764" cy="125" r="34" fill="#ea580c"/>
    <text x="764" y="134" font-size="26" font-weight="800" fill="#fff">5</text>
    <text x="764" y="190" font-size="17" font-weight="700" fill="#1e293b">Grid Layout</text>
    <!-- 6 -->
    <circle cx="927" cy="125" r="34" fill="#0d9488"/>
    <text x="927" y="134" font-size="26" font-weight="800" fill="#fff">6</text>
    <text x="927" y="190" font-size="17" font-weight="700" fill="#1e293b">Web</text>
    <text x="927" y="212" font-size="17" font-weight="700" fill="#1e293b">Responsive</text>
    <!-- 7 -->
    <circle cx="1090" cy="125" r="34" fill="#0891b2"/>
    <text x="1090" y="134" font-size="26" font-weight="800" fill="#fff">7</text>
    <text x="1090" y="190" font-size="17" font-weight="700" fill="#1e293b">Herramientas</text>
    <text x="1090" y="212" font-size="17" font-weight="700" fill="#1e293b">CSS</text>
  </g>
</svg>
