<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Diseño de Interfaces Web - 2º DAW">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- rejilla decorativa -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
  </g>

  <!-- textos -->
  <text x="70" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#67e8f9" letter-spacing="4">2º DAW · DESARROLLO DE APLICACIONES WEB</text>
  <text x="70" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Diseño de Interfaces Web</text>
  <rect x="70" y="205" width="160" height="6" rx="3" fill="url(#acc)"/>
  <text x="70" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e0e7ff">Ejemplos de clase · CSS3 avanzado · Layout · Responsive</text>

  <!-- ventana de navegador -->
  <g transform="translate(830 70)">
    <rect width="300" height="220" rx="14" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect width="300" height="34" rx="14" fill="#1e293b"/>
    <rect y="20" width="300" height="14" fill="#1e293b"/>
    <circle cx="20" cy="17" r="6" fill="#f87171"/>
    <circle cx="40" cy="17" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="17" r="6" fill="#34d399"/>
    <!-- layout grid -->
    <rect x="16" y="48" width="268" height="28" rx="6" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="16" y="86" width="80" height="118" rx="6" fill="#a78bfa" fill-opacity="0.85"/>
    <rect x="106" y="86" width="178" height="54" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="106" y="150" width="84" height="54" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="200" y="150" width="84" height="54" rx="6" fill="#f472b6" fill-opacity="0.85"/>
  </g>

  <!-- etiqueta de código -->
  <text x="830" y="325" font-family="Consolas, Menlo, monospace" font-size="20" fill="#a5f3fc">display: grid;</text>
</svg>
